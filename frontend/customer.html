<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer · Nexora</title><link rel="stylesheet" href="portal.css"></head><body><main><nav><a href="/">NEXORA</a><a href="customer.html">Customer</a><a href="driver.html">Driver</a><a href="admin.html">Admin</a></nav><h1>Book your ride</h1><div id="auth"><form id="login" class="card"><h2>Sign in</h2><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p class="error" id="login-error" role="alert"></p></form><details class="card"><summary>Create a customer account</summary><form id="registration"><div class="grid"><label>First name<input name="first_name" autocomplete="given-name" required maxlength="100"></label><label>Last name<input name="last_name" autocomplete="family-name" required maxlength="100"></label></div><label>Phone number<input name="phone" type="tel" autocomplete="tel" minlength="8" maxlength="20" required></label><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password (8–72 characters)<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label><button>Create account</button><p id="message" role="status"></p></form></details></div><div id="account" hidden><p>Signed in as <strong id="name"></strong> <button id="logout" class="secondary">Sign out</button></p><form id="ride" class="card"><h2>Where are you going?</h2><p class="muted">Enter the pickup and destination coordinates as well as their addresses. Address search is not available yet.</p><button id="locate" type="button" class="secondary">Use my location for pickup</button><div class="grid"><label>Pickup address<input name="pickup_address" type="text" required></label><label>Pickup latitude<input name="pickup_lat" type="number" step="any" min="-90" max="90" required></label><label>Pickup longitude<input name="pickup_lng" type="number" step="any" min="-180" max="180" required></label><label>Destination address<input name="dropoff_address" type="text" required></label><label>Destination latitude<input name="dropoff_lat" type="number" step="any" min="-90" max="90" required></label><label>Destination longitude<input name="dropoff_lng" type="number" step="any" min="-180" max="180" required></label></div><p>Payment: cash to your driver. No card is charged.</p><button>Request ride</button><p id="ride-error" class="error" role="alert"></p></form><section id="current" class="card" hidden></section><section class="card"><h2>Your rides</h2><button id="refresh" class="secondary">Refresh</button><div id="history"></div></section></div></main><script src="portal.js"></script></body></html>
