<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver registration · Nexora</title><link rel="stylesheet" href="portal.css"></head><body><main><nav><a href="/">NEXORA</a><a href="customer.html">Customer</a><a href="driver.html">Driver</a><a href="admin.html">Admin</a></nav><h1>Become a Nexora driver</h1><p>Register your details and vehicle. An administrator must review and approve your account.</p><form class="card" id="registration"><div class="grid"><label>First name<input name="first_name" autocomplete="given-name" required maxlength="100"></label><label>Last name<input name="last_name" autocomplete="family-name" required maxlength="100"></label></div><label>Phone number<input name="phone" type="tel" autocomplete="tel" minlength="8" maxlength="20" required></label><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password (8–72 characters)<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label><label>Operating mode<select name="mode"><option value="ride">Rides</option><option value="freight">Freight</option><option value="both">Rides and freight</option></select></label><h2>Your vehicle</h2><div class="grid"><label>Plate number<input name="plate_number" required minlength="2" maxlength="20"></label><label>Make<input name="make" required maxlength="50"></label><label>Model<input name="model" required maxlength="50"></label><label>Year<input name="year" type="number" min="1990" required></label><label>Color<input name="color" required maxlength="30"></label><label>Vehicle type<select name="vehicle_type"><option value="sedan">Sedan</option><option value="hatchback">Hatchback</option><option value="suv">Suv</option><option value="luxury">Luxury</option><option value="van">Van</option><option value="truck_small">Truck Small</option><option value="truck_medium">Truck Medium</option><option value="truck_large">Truck Large</option><option value="refrigerated">Refrigerated</option><option value="motorcycle">Motorcycle</option><option value="bicycle">Bicycle</option></select></label></div><button>Create driver account</button><p id="message" role="status"></p></form><section id="success" class="card" hidden><h2>Registration received</h2><p>Your account is waiting for admin approval. You can sign in now; go online after approval.</p><a class="button" href="driver.html">Open driver app</a></section></main><script src="portal.js"></script></body></html>
